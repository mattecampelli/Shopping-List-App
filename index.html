<!DOCTYPE html>
    <html lang="it">
        <head>
            <meta charset="UTF-8">
            <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
            <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
            <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
            <link rel="manifest" href="site.webmanifest">
            <title>Shopping List App</title>
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="style.css">
            <script type="module" src="index.js"></script>
        </head>
        <body>
            <div class="blob-1"></div>
            <div class="blob-2"></div>
            <div class="blob-3"></div>
            <div id="overlay"></div>
            <div class="container">
                <h1>Shopping List</h1>
                <form id="form">
                    <label for="input-el" class="visually-hidden">Prodotto da aggiungere</label>
                    <input type="text" id="input-el" placeholder="Enter item">
                    <div id="btn-container">
                        <button id="add-btn" type="submit">ADD ITEM</button>
                        <button type="button" id="select-btn">DELETE ITEM</button>
                        <button type="button" id="delete-btn">DELETE ALL</button>
                    </div>
                </form>
                <ul id="ul-el"></ul>
                <button type="button" id="delete-selected-btn">DELETE SELECTED</button>
            </div>
        </body>
    </html>
